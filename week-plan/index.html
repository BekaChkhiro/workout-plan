<!-- Style A — Warm Minimalist -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Noto+Serif+Georgian:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Manrope', system-ui, sans-serif; }

  /* ---- Style A — Warm Minimalist ---- */
  .style-a {
    --bg: #FAF6F0;
    --surface: #FFFFFF;
    --ink: #5C4033;
    --ink-soft: #8B6F5C;
    --ink-mute: #B8A595;
    --mint: #A8D5BA;
    --peach: #F5B7A1;
    --cream-stroke: #EFE5D6;
    --shadow-sm: 0 1px 2px rgba(92,64,51,0.04), 0 2px 6px rgba(92,64,51,0.04);
    --shadow-md: 0 2px 4px rgba(92,64,51,0.04), 0 8px 24px rgba(92,64,51,0.07);

    font-family: 'Manrope', 'Noto Sans Georgian', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .style-a .display { font-family: 'DM Serif Display', 'Noto Serif Georgian', serif; font-weight: 400; letter-spacing: -0.01em; }
  .style-a .serif { font-family: 'DM Serif Display', 'Noto Serif Georgian', serif; font-weight: 400; }

  /* ---- Style B — Premium Dark ---- */
  .style-b {
    --bg: #0A0A0B;
    --card: #16161A;
    --card-2: #1E1E24;
    --hair: rgba(255,255,255,0.07);
    --ink: #FFFFFF;
    --ink-soft: rgba(255,255,255,0.62);
    --ink-mute: rgba(255,255,255,0.38);
    --neon: #A8FF60;
    --neon-dim: rgba(168,255,96,0.16);
    --pink: #FF3D71;

    font-family: 'Space Grotesk', 'Noto Sans Georgian', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .style-b .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: 'tnum'; }
  .style-b .caps { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 500; }

  /* ---- Style C — Soft Pastel Feminine ---- */
  .style-c {
    --bg-1: #F4E5FA;
    --bg-2: #FCE4EC;
    --surface: #FFFFFF;
    --ink: #3D2C5F;
    --ink-soft: #7B6A9B;
    --ink-mute: #B7AAD0;
    --mint: #7DDFA8;
    --yellow: #FFD66B;
    --pink: #FF9EC5;
    --lilac: #C9A8E8;
    --shadow-pink: 0 4px 16px rgba(255,158,197,0.18), 0 1px 4px rgba(201,168,232,0.12);

    font-family: 'DM Sans', 'Noto Sans Georgian', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  }
</style>
